services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civicguide
      POSTGRES_PASSWORD: civicguide
      POSTGRES_DB: civicguide
    ports:
      - "5432:5432"
    volumes:
      - civicguide_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicguide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civicguide_pg:
