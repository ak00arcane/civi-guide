[project]
name = "civicguide-backend"
version = "0.1.0"
description = "CivicGuide API, eligibility, NLP, and recommendation engines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8.0"]
embeddings = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
